<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<meta name="description" content="Bloom - hop, glow and collect. A neon platformer where everything glows.">
<title>Bloom</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden; background: #09090d; }
body { touch-action: none; color: #f4f4f7; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#canvas { display: block; outline: none; }
#status {
	position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; visibility: hidden;
	background: radial-gradient(55% 45% at 50% 40%, rgba(56, 232, 255, .13), transparent 70%), radial-gradient(40% 40% at 70% 70%, rgba(181, 123, 255, .08), transparent 70%), #09090d;
}
#status-splash { width: min(86vw, 560px); height: auto; margin: -40px 0; mix-blend-mode: screen; animation: breathe 3.6s ease-in-out infinite;
	-webkit-mask-image: radial-gradient(closest-side, #000 34%, transparent 100%); mask-image: radial-gradient(closest-side, #000 34%, transparent 100%); }
#status-meta { width: min(64vw, 260px); }
#status-track { height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .1); overflow: hidden; }
#status-bar { height: 100%; width: 100%; border-radius: 3px; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, #38e8ff, #b57bff); box-shadow: 0 0 12px rgba(56, 232, 255, .6); }
#status.indeterminate #status-bar { width: 40%; transform: none; animation: slide 1.4s ease-in-out infinite; }
#status-text { margin-top: 14px; display: flex; justify-content: space-between; font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: #6a70a8; }
#status-pct { color: #a3a8d6; font-variant-numeric: tabular-nums; }
#status-notice { font-size: 14px; color: #a3a8d6; text-align: center; max-width: min(80vw, 420px); line-height: 1.5; display: none; }
#rotate {
	position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
	background: #09090d; color: #a3a8d6; font-size: 17px; gap: 20px; z-index: 5; text-align: center;
}
#rotate .ph { width: 44px; height: 76px; border: 2px solid #38e8ff; border-radius: 10px; box-shadow: 0 0 18px rgba(56, 232, 255, .5); animation: turn 2.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .8; transform: scale(1.03); } }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
@keyframes turn { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
@media (prefers-reduced-motion: reduce) { #status-splash, #status.indeterminate #status-bar { animation: none; } }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support HTML5 canvas.</canvas>
<noscript>Bloom needs JavaScript to run.</noscript>
<div id="rotate"><div class="ph"></div><div>Rotate your device to play Bloom</div></div>
<div id="status" class="indeterminate">
	<img id="status-splash" src="$GODOT_SPLASH" alt="Bloom">
	<div id="status-meta">
		<div id="status-track"><div id="status-bar"></div></div>
		<div id="status-text"><span>Loading</span><span id="status-pct">0%</span></div>
	</div>
	<div id="status-notice"></div>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const statusEl = document.getElementById('status');
const barEl = document.getElementById('status-bar');
const pctEl = document.getElementById('status-pct');
const noticeEl = document.getElementById('status-notice');
const metaEl = document.getElementById('status-meta');

function showNotice(msg) { metaEl.style.display = 'none'; noticeEl.style.display = 'block'; noticeEl.textContent = msg; }

// ease the displayed progress toward the real value so the bar never jumps
let target = 0, shown = 0;
(function tick() {
	shown += (target - shown) * 0.14;
	if (target - shown < 0.002) shown = target;
	barEl.style.transform = 'scaleX(' + shown.toFixed(4) + ')';
	pctEl.textContent = Math.round(shown * 100) + '%';
	requestAnimationFrame(tick);
})();

(function init() {
	const missing = Engine.getMissingFeatures();
	if (missing.length !== 0) {
		statusEl.style.visibility = 'visible';
		showNotice('Your browser cannot run Bloom (missing: ' + missing.join(', ') + '). Please try an up-to-date browser.');
		return;
	}
	statusEl.style.visibility = 'visible';
	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) { statusEl.classList.remove('indeterminate'); target = Math.min(1, current / total); }
		},
	}).then(function () {
		target = 1;
		statusEl.style.transition = 'opacity .5s';
		statusEl.style.opacity = '0';
		setTimeout(function () { statusEl.style.display = 'none'; }, 520);
	}, function (err) {
		showNotice('Bloom failed to start: ' + err.message);
	});
})();
</script>
</body>
</html>
